{% extends "base.html" %}
{% block content %}
<p>{{ total_prefixes }} WPX prefixes worked.</p>
<div class="table-wrap">
<table class="mtc">
    <tr class="thc">
        <th>#</th>
        <th>Prefix</th>
        <th>QSOs</th>
        <th>Country</th>
    </tr>
    {% for p in prefix_rows %}
    <tr class="{{ loop_class(loop.index) }}">
        <td>{{ loop.index }}</td>
        <td class="tal">{{ p.prefix }}</td>
        <td>{{ p.count }}</td>
        <td class="tal">{{ p.country }}</td>
    </tr>
    {% endfor %}
</table>
</div>
{% endblock %}
