{% extends "base.html" %}
{% block content %}
{% if description %}<p>{{ description }}</p>{% endif %}
<div class="table-wrap">
<table class="mtc">
    <tr class="thc">
        {% for h in headers %}
        <th>{{ h }}</th>
        {% endfor %}
    </tr>
    {% for row in rows %}
    <tr class="{{ loop_class(loop.index) }}">
        {% for cell in row %}
        <td>{{ cell }}</td>
        {% endfor %}
    </tr>
    {% endfor %}
</table>
</div>
{% endblock %}
