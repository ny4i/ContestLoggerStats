{% extends "base.html" %}
{% block content %}
<p>{{ subtitle }}</p>
<div class="table-wrap">
<table class="mtc">
    <tr class="thc">
        <th>#</th>
        <th>Time</th>
        <th>QSOs</th>
        <th>Call</th>
        <th>Band</th>
        <th>Mode</th>
    </tr>
    {% for m in minute_rows %}
    <tr class="{{ loop_class(loop.index) }}">
        <td>{{ loop.index }}</td>
        <td>{{ m.time }}</td>
        <td>{{ m.count }}</td>
        <td class="tal">{% for call in m.calls %}<a rel="nofollow noopener noreferrer" target="_blank" href="{{ callsign_url(call) }}">{{ call }}</a>{% if not loop.last %}, {% endif %}{% endfor %}</td>
        <td class="tal">{{ m.band }}</td>
        <td class="tal">{{ m.mode }}</td>
    </tr>
    {% endfor %}
</table>
</div>
{% endblock %}
